# teknomedis.com & www — dipindah dari proxy kvm1 (187.77.158.130) ke server ini, 18 Okt 2026 (owner).
# Isi = salinan konfigurasi kvm1 dengan tujuan lokal: license-server 127.0.0.1:8061, Panel 127.0.0.1:8062,
# landing 127.0.0.1:8888, APK dari /srv/www/care-apk. HRIS (kvm1) memanggil https://teknomedis.com/api.
server {
    server_name teknomedis.com www.teknomedis.com;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/teknomedis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teknomedis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload release ZIP via admin panel (/upload-update)
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # Affiliate public form endpoints — rate limited
    location = /api/affiliate/signup {
        limit_req zone=affiliate_signup burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8061/api/affiliate/signup;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/affiliate/dashboard {
        limit_req zone=affiliate_dashboard burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8061/api/affiliate/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # License server: public API (Hub, HRIS, Care, pembayaran)
    location /api/ {
        proxy_pass http://127.0.0.1:8061/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel admin_v2 assets → Panel (8062)
    location /static/admin_v2/ {
        proxy_pass http://127.0.0.1:8062;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # License server: public static assets (logo, dll)
    location /static/ {
        proxy_pass http://127.0.0.1:8061/static/;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # License server: webhook pembayaran
    location /midtrans/ {
        proxy_pass http://127.0.0.1:8061/midtrans/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Link bayar invoice publik
    location /pay/ {
        proxy_pass http://127.0.0.1:8061;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Super admin + dev panel (license-server UI)
    location /admin/ {
        proxy_pass http://127.0.0.1:8061/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== UNIFIED ADMIN PANEL =====
    location = /panel {
        return 301 /panel/;
    }
    location /panel/ {
        proxy_pass http://127.0.0.1:8062;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v2/ {
        proxy_pass http://127.0.0.1:8062;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # License-server action endpoints (dev panel JS & Hub klien)
    location ~ ^/(generate|history|revoke|unrevoke|pricing|confirm-payment|reject-request|send-license-email|email-config|updates|toggle-update|delete-update)(/.*)?$ {
        proxy_pass http://127.0.0.1:8061;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(renewal-requests|check-revoked|check-update|download-update|pending-key|mark-delivered|update-applied|request-renewal|ping)(/.*)?$ {
        proxy_pass http://127.0.0.1:8061;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login {
        proxy_pass http://127.0.0.1:8061/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /logout {
        proxy_pass http://127.0.0.1:8061/logout;
        proxy_set_header Host $host;
    }

    # APK download (Halo Hasna, Dokter Hasna, dll)
    location /care-apk/ {
        alias /srv/www/care-apk/;
        autoindex off;
        add_header Content-Disposition 'attachment';
        expires 5m;
        types {
            application/vnd.android.package-archive apk;
        }
    }

    # Google Search Console verification (Play org website)
    location = /google1e7434827eccdaf9.html {
        default_type text/html;
        return 200 "google-site-verification: google1e7434827eccdaf9.html";
    }

    # Landing page (catch-all — keep LAST)
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name teknomedis.com www.teknomedis.com;

    # Perpanjangan sertifikat otomatis (certbot webroot /var/www/acme-www).
    location /.well-known/acme-challenge/ {
        root /var/www/acme-www;
    }

    # Selama masa peralihan kvm1 masih meneruskan /care-apk/ ke port 80 server ini.
    location /care-apk/ {
        alias /srv/www/care-apk/;
        autoindex off;
        add_header Content-Disposition 'attachment';
        expires 5m;
        types {
            application/vnd.android.package-archive apk;
        }
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
